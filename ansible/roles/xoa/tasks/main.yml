# roles/xoa/tasks/main.yml
---
- name: Update all packages to latest version
  apt:
    update_cache: yes
    upgrade: dist
    autoclean: yes
    autoremove: yes
  become: true

- name: Ensure required OS base packages are installed
  package:
    name: "{{ item }}"
    state: present
  with_items: "{{ xoa_server_pkgs }}"
  become: true

- name: Create forced symlink /opt to /data
  file:
    src: /opt
    dest: /data
    state: link
    force: yes
  become: true

- name: Create forced symlink /usr/local to /data
  file:
    src: /usr/local
    dest: /data
    state: link
    force: yes
  become: true

- name: Copy xo_install.sh script to /tmp and set permissions
  copy:
    src: xo_install.sh
    dest: /tmp/xo_install.sh
    mode: '0755'
  become: true

- name: Run xo_install.sh script as root
  command: /tmp/xo_install.sh
  become: true

